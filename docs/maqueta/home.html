<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Futbol Argentina · Liga Profesional</title>
<style>
:root{--bg:#0f1720;--card:#17212d;--line:#243242;--tx:#e8eef5;--mut:#8ea0b3;--acc:#3ddc97;--acc2:#5aa9ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f2f5f9;--card:#fff;--line:#dde4ec;--tx:#14202e;--mut:#5d7087;--acc:#0a9b62;--acc2:#1f6fd1}}
:root[data-theme="light"]{--bg:#f2f5f9;--card:#fff;--line:#dde4ec;--tx:#14202e;--mut:#5d7087;--acc:#0a9b62;--acc2:#1f6fd1}
:root[data-theme="dark"]{--bg:#0f1720;--card:#17212d;--line:#243242;--tx:#e8eef5;--mut:#8ea0b3;--acc:#3ddc97;--acc2:#5aa9ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1150px;margin:0 auto;padding:20px 16px 40px}
h1{margin:0;text-align:center;font-size:clamp(26px,5vw,40px);letter-spacing:.5px}
h1 span{color:var(--acc)}
.sub{margin:8px auto 22px;text-align:center;max-width:320px;padding:6px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--mut);padding:7px 14px;border-radius:8px;font:600 14px inherit;font-family:inherit}
.tabs button.on{background:var(--acc);color:#04130c;border-color:var(--acc)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.card h2{margin:0 0 10px;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ov{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:6px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:12px}
td.t{text-align:left}
td.p,th.p{font-weight:700;color:var(--acc)}
.tm{display:inline-flex;align-items:center;gap:8px}
.cr{width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--acc2);font-size:8px;font-weight:800;display:inline-grid;place-items:center;flex:none}
.nav{display:flex;align-items:center;gap:6px}
.nav button{cursor:pointer;width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--tx)}
.nav b{font-size:13px;min-width:70px;text-align:center}
.m{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.m .h{text-align:right}.m .tm{flex-direction:row}.m .h .tm{flex-direction:row-reverse}
.m i{font-style:normal;color:var(--mut);font-size:12px;background:var(--bg);border-radius:6px;padding:2px 8px}
.bot{max-width:620px;margin:18px auto 0}
.note{color:var(--mut);font-size:12px;text-align:center;margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Futbol <span>Argentina</span></h1>
  <div class="sub">Liga Profesional 2026</div>

  <div class="grid">
    <section>
      <div class="tabs" id="tabs"></div>
      <div class="card">
        <h2 id="tt">Tabla</h2>
        <div class="ov"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div>
      </div>
    </section>

    <section>
      <div class="tabs" style="visibility:hidden"><button>.</button></div>
      <div class="card">
        <h2>Fixture
          <span class="nav"><button id="pv">‹</button><b id="fl"></b><button id="nx">›</button></span>
        </h2>
        <div id="fx"></div>
      </div>
    </section>
  </div>

  <div class="card bot">
    <h2>Goleadores y asistidores</h2>
    <div class="tabs" id="ptabs"></div>
    <div class="ov"><table><thead><tr><th>#</th><th style="text-align:left">Jugador</th><th style="text-align:left">Equipo</th><th class="p" id="pc">Goles</th></tr></thead><tbody id="pb"></tbody></table></div>
  </div>

  <p class="note">Maqueta visual · datos de ejemplo. Próximo paso: conectar con FastAPI + PostgreSQL.</p>
</div>

<script>
const TEAMS=[["Aldosivi","ALD"],["Argentinos Juniors","ARG"],["Atlético Tucumán","ATU"],["Banfield","BAN"],["Barracas Central","BAR"],["Belgrano","BEL"],["Boca Juniors","BOC"],["Central Córdoba (SdE)","CCO"],["Defensa y Justicia","DYJ"],["Deportivo Riestra","RIE"],["Estudiantes (LP)","EST"],["Estudiantes (RC)","ERC"],["Gimnasia (LP)","GLP"],["Gimnasia (M)","GME"],["Huracán","HUR"],["Independiente","IND"],["Independiente Rivadavia","IRI"],["Instituto","INS"],["Lanús","LAN"],["Newell's Old Boys","NOB"],["Platense","PLA"],["Racing Club","RAC"],["River Plate","RIV"],["Rosario Central","ROS"],["San Lorenzo","SLO"],["Sarmiento","SAR"],["Talleres","TAL"],["Tigre","TIG"],["Unión","UNI"],["Vélez Sarsfield","VEL"]];
const $=id=>document.getElementById(id);
const crest=t=>`<span class="tm"><span class="cr">${t[1]}</span>${t[0]}</span>`;

// 4) Tabla
const MODES={
  Clausura:["Pos","Equipo","PJ","PG","PE","PP","GF","GC","DG","Pts"],
  Apertura:["Pos","Equipo","PJ","PG","PE","PP","GF","GC","DG","Pts"],
  Anual:["Pos","Equipo","PJ","PG","PE","PP","GF","GC","DG","Pts"],
  Promedios:["Pos","Equipo","2024","2025","2026","PJ","Prom"]
};
let mode="Clausura";
function renderTable(){
  const cols=MODES[mode];
  $("tt").textContent="Tabla · "+mode;
  $("th").innerHTML="<tr>"+cols.map(c=>`<th class="${c=="Pts"||c=="Prom"?"p":""}" style="${c=="Equipo"?"text-align:left":""}">${c}</th>`).join("")+"</tr>";
  $("tb").innerHTML=TEAMS.map((t,i)=>{
    const cells=cols.map(c=>c=="Pos"?i+1:c=="Equipo"?`<td class="t">${crest(t)}</td>`:null);
    return "<tr>"+cols.map((c,j)=>c=="Equipo"?cells[j]:`<td class="${c=="Pts"||c=="Prom"?"p":""}">${c=="Pos"?i+1:c=="Prom"?"0.000":0}</td>`).join("")+"</tr>";
  }).join("");
  $("tabs").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.textContent==mode));
}
$("tabs").innerHTML=Object.keys(MODES).map(m=>`<button>${m}</button>`).join("");
$("tabs").onclick=e=>{if(e.target.tagName=="BUTTON"){mode=e.target.textContent;renderTable()}};

// 5) Fixture (emparejamientos de ejemplo, método del círculo)
const NF=16;let fecha=1;
function pairs(r){
  const n=TEAMS.length,rest=[...Array(n-1).keys()].map(x=>x+1);
  const rot=[...rest.slice(rest.length-(r%(n-1))),...rest.slice(0,rest.length-(r%(n-1)))];
  const a=[0,...rot];return [...Array(n/2).keys()].map(i=>[a[i],a[n-1-i]]);
}
function renderFixture(){
  $("fl").textContent="Fecha "+fecha;
  $("fx").innerHTML=pairs(fecha-1).map(([h,a])=>`<div class="m"><span class="h">${crest(TEAMS[h])}</span><i>vs</i><span>${crest(TEAMS[a])}</span></div>`).join("");
}
$("pv").onclick=()=>{fecha=fecha>1?fecha-1:NF;renderFixture()};
$("nx").onclick=()=>{fecha=fecha<NF?fecha+1:1;renderFixture()};

// 6) Goleadores / asistidores
let pm="Goleadores";
function renderPlayers(){
  $("pc").textContent=pm=="Goleadores"?"Goles":"Asist.";
  $("pb").innerHTML=[...Array(10).keys()].map(i=>`<tr><td>${i+1}</td><td class="t">Jugador ${i+1}</td><td class="t">—</td><td class="p">0</td></tr>`).join("");
  $("ptabs").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.textContent==pm));
}
$("ptabs").innerHTML="<button>Goleadores</button><button>Asistidores</button>";
$("ptabs").onclick=e=>{if(e.target.tagName=="BUTTON"){pm=e.target.textContent;renderPlayers()}};

renderTable();renderFixture();renderPlayers();
</script>
</body>
</html>
